name: Upstream Sync

# 只给必要权限，最小权限原则
permissions:
  contents: write

on:
  # 每天北京时间 06:00 运行（UTC 22:00）
  schedule:
    - cron: "0 22 * * *"
  # 支持手动触发
  workflow_dispatch:

# 防止同一时间重复运行（手动+定时冲突时取消旧的）
concurrency:
  group: upstream-sync
  cancel-in-progress: true

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream
    runs-on: ubuntu-latest
    # 仅在 fork 仓库中运行，防止误在上游仓库执行
    if: ${{ github.event.repository.fork == true }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          # 获取完整历史，便于正确 merge/rebase
          fetch-depth: 0
          # 使用 token 以便后续 push
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync upstream changes
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.1
        with:
          upstream_sync_repo: Toperlock/sing-box-subscribe
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          # 遇到冲突时保留自己的修改（false 表示不强制覆盖）
          # 如希望强制与上游完全一致，可改为 true
          upstream_pull_args: "--ff-only"
          # 关闭测试模式
          test_mode: false

      # 同步失败时给出明确提示（常见原因：上游改了 workflow 文件导致 GitHub 自动禁用）
      - name: Sync failure notice
        if: failure()
        run: |
          echo "::error::同步失败！常见原因："
          echo "1. 上游仓库修改了 .github/workflows 文件，GitHub 会自动暂停定时任务"
          echo "2. 存在无法 fast-forward 的冲突"
          echo ""
          echo "解决方法："
          echo "1. 打开仓库 → 点击右上角 Sync fork → Update branch"
          echo "2. 然后重新启用本 Workflow（Actions 页面）"
          exit 1

      # 同步成功时输出简要信息
      - name: Sync success
        if: success()
        run: |
          echo "✅ 已成功同步上游 Toperlock/sing-box-subscribe 最新代码"
